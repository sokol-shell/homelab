apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: atuin
  namespace: atuin
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.10
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: atuin
      owner: atuin
  monitoring:
    enablePodMonitor: true
  podSecurityContext:
    appArmorProfile:
      type: Unconfined

# By default, deny all ingress and egress for every pod in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Every pod may resolve DNS via CoreDNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# App pod: ingress only from traefik, egress only to its own database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atuin-app
spec:
  podSelector:
    matchLabels:
      io.kompose.service: atuin
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8888
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: atuin
      ports:
        - port: 5432
          protocol: TCP
---
# Database pods: ingress from the app, pgadmin, prometheus and the CNPG
# operator; egress to the kube API and sibling instances.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atuin-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: atuin
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              io.kompose.service: atuin
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pgadmin
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pgadmin4
        - podSelector:
            matchLabels:
              cnpg.io/cluster: atuin
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9187
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - port: 8000
          protocol: TCP
  egress:
    # kube-apiserver on the control-plane node. kube-router evaluates egress
    # after the service DNAT, so the node IP is what must be allowed here.
    - to:
        - ipBlock:
            cidr: 192.168.1.97/32
      ports:
        - port: 6443
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: atuin
      ports:
        - port: 5432
          protocol: TCP

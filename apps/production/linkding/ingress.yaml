apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkding
  namespace: linkding
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - linkding..sokol.sh
  rules:
  - host: linkding..sokol.sh
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: linkding
            port: 
              number: 9090

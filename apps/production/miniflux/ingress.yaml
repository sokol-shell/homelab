apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miniflux
  namespace: miniflux
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - rss.sokol.sh
  rules:
  - host: rss.sokol.sh
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: miniflux
            port: 
              number: 8080

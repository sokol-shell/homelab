apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atuin
  namespace: atuin
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - atuin.staging.sokol.sh
  rules:
  - host: atuin.staging.sokol.sh
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: atuin
            port:
              number: 8888

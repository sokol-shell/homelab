apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-configmap
  namespace: n8n
data:
  DB_TYPE: postgresdb
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_HOST: n8n.staging.sokol.sh
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_PORT: "3008"
  N8N_PROTOCOL: https
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_EDITOR_BASE_URL: https://n8n.staging.sokol.sh/
  WEBHOOK_URL: https://n8n.staging.sokol.sh/

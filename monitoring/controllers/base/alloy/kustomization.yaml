apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - release.yaml
# The HelmRelease references this ConfigMap by its fixed name, and the chart's
# config-reloader sidecar picks up changes in place, so no hash suffix.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: "1.16.*"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    alloy:
      configMap:
        # The pipeline lives in its own ConfigMap (config.alloy) next to this
        # release, so it can be edited without touching Helm values.
        create: false
        name: alloy-config
        key: config.alloy
      # Where loki.source.file keeps its positions file (read offset per log
      # file). Backed by a hostPath below so a restarted pod resumes where the
      # previous one stopped instead of re-shipping or skipping lines.
      storagePath: /var/lib/alloy
      extraEnv:
        # Used by discovery.kubernetes to only watch pods on this node.
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      mounts:
        # Mounts the node's /var/log read-only; container logs are under
        # /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log.
        varlog: true
        extra:
          - name: positions
            mountPath: /var/lib/alloy
      securityContext:
        # containerd writes log files as root with mode 0640, so the tailer has
        # to be root to read them. No capabilities are needed on top of that.
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      # Telemetry back to Grafana Labs.
      enableReporting: false
    controller:
      # One pod per node: each one can only see the log files on its own node.
      type: daemonset
      volumes:
        extra:
          - name: positions
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate
    serviceMonitor:
      enabled: true

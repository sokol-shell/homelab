apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: "7.6.*"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 12h
  values:
    # One Loki process holding every component (distributor, ingester, querier,
    # compactor...). Right-sized for a two-node homelab; the scalable modes need
    # object storage and several pods each.
    deploymentMode: SingleBinary
    loki:
      # Single tenant: Alloy and Grafana don't need to send X-Scope-OrgID.
      auth_enabled: false
      commonConfig:
        # Only one ingester exists, so each stream can be written exactly once.
        replication_factor: 1
      storage:
        # Chunks and index live on the pod's PVC, no object store involved.
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        # Keep 30 days of logs; the compactor deletes older chunks.
        retention_period: 720h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      pattern_ingester:
        # Powers the pattern view in Grafana Logs Drilldown.
        enabled: true
    singleBinary:
      replicas: 1
      persistence:
        # local-path PVC; binds to whichever node the pod first lands on.
        size: 10Gi
    # Scalable targets must be 0 in SingleBinary mode.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    # Helpers that make sense at scale but only add pods here. Grafana and Alloy
    # talk to the "loki" service directly on port 3100.
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    monitoring:
      serviceMonitor:
        # Let Prometheus scrape Loki's own metrics.
        enabled: true
